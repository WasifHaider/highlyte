# Production compose file for the HighLyte EC2 instance. The deploy workflow
# copies this to ~/highlyte on the server; secrets live in ~/highlyte/.env.
services:
  backend:
    image: ${ECR_REGISTRY}/highlyte-backend:latest
    restart: unless-stopped
    env_file: .env
    # Only reachable from the host itself: Cloudflare Tunnel (cloudflared on
    # the host) is the public entry point, so no inbound port is opened.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Clip files, the download cache and the face model survive redeploys.
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # YouTube blocks EC2's IP, so yt-dlp downloads through teammates' home
  # laptops. Each sidecar joins the tailnet, sends its traffic out through
  # one teammate's laptop (a Tailscale exit node) and offers a SOCKS5 proxy
  # on port 1055. The backend tries them in YTDLP_PROXIES order, e.g.
  # YTDLP_PROXIES=socks5://ts-muntazir:1055. Setup: docs/tailscale-download-route.md.
  # --exit-node must be the laptop's Tailscale IP (100.x.y.z, from the admin
  # console): the sidecar can't resolve a machine name while starting up.
  # To add a teammate, copy this block, change the name, hostname, exit-node
  # variable and state folder, and append the proxy to YTDLP_PROXIES.
  ts-muntazir:
    image: tailscale/tailscale:stable
    restart: unless-stopped
    hostname: hl-proxy-muntazir
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_USERSPACE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_SOCKS5_SERVER: ":1055"
      TS_EXTRA_ARGS: "--exit-node=${MUNTAZIR_EXIT_NODE} --exit-node-allow-lan-access"
    volumes:
      - ./ts/muntazir:/var/lib/tailscale
